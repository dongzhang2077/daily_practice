<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theseus · 个人计时</title>
</head>
<body>
    <h1>Theseus</h1>
    <p>个人活动计时</p>
    <section aria-labelledby="activity-title">
        <h2 id="activity-title">Coding 练习</h2>
        <p id="timer-status" role="status">尚未开始</p>
        <p>已用时间：<span id="elapsed-seconds">0</span> 秒</p>
        <button id="start-button" type="button">开始计时</button>
    </section>
    <section aria-labelledby="reading-title">
        <h2 id="reading-title">技术阅读</h2>
        <p id="reading-status" role="status">尚未开始</p>
        <p>已用时间：<span id="reading-elapsed-seconds">0</span> 秒</p>
        <button id="reading-start-button" type="button">开始计时</button>
    </section>
    <script type="module" src="./src/app.js"></script>
    <script type="module" src="./checks/elapsed_time_checks.js"></script>
</body>
</html>
